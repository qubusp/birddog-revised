# Birddog stack on one machine: Postgres (system of record + Airflow metadata)
# and Airflow 3 with the LocalExecutor. Everything binds to 127.0.0.1; reach the
# Airflow UI through an SSH tunnel until Caddy is added:
#   ssh -L 8080:127.0.0.1:8080 administrator@<host>
#
# Secrets live in deploy/.env (not committed) -- see .env.example.
#   docker compose up -d --build

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: deploy/airflow/Dockerfile
  image: birddog-airflow:local
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${JWT_SECRET}
    AIRFLOW__API_AUTH__JWT_ISSUER: birddog
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Birddog's own database, used by the DAGs
    AIRFLOW_CONN_BIRDDOG_PG: postgresql://birddog:${BIRDDOG_DB_PASSWORD}@postgres:5432/birddog
    # the birddog library itself reads this (birddog/pg.py)
    BIRDDOG_DATABASE_URL: postgresql://birddog:${BIRDDOG_DB_PASSWORD}@postgres:5432/birddog
    PYTHONPATH: /opt/birddog
  volumes:
    - ../dags:/opt/airflow/dags
    - ../birddog:/opt/birddog/birddog
    - ../resources:/opt/birddog/resources
    - airflow-logs:/opt/airflow/logs
    - birddog-cache:/opt/birddog/.cache
  # birddog loads resources/*.json relative to the working directory
  working_dir: /opt/birddog
  user: "50000:0"
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      BIRDDOG_DB_PASSWORD: ${BIRDDOG_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      retries: 5
      start_period: 5s

  # Applies deploy/db/migrations/*.sql in order on every `up`. Each file is
  # idempotent, so re-running is safe.
  migrate:
    image: postgres:16
    environment:
      PGHOST: postgres
      PGUSER: birddog
      PGDATABASE: birddog
      PGPASSWORD: ${BIRDDOG_DB_PASSWORD}
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c", "for f in /migrations/*.sql; do echo \"applying $$f\"; psql -v ON_ERROR_STOP=1 -q -f \"$$f\" || exit 1; done"]
    depends_on:
      postgres:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: ["-c", "/entrypoint airflow version"]
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    user: "0:0"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

volumes:
  pg-data:
  airflow-logs:
  birddog-cache:
