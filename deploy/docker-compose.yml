# Birddog stack on one machine: Postgres (system of record + Airflow metadata)
# and Airflow 3 with the LocalExecutor. Everything binds to 127.0.0.1; reach the
# Airflow UI through an SSH tunnel until Caddy is added:
#   ssh -L 8080:127.0.0.1:8080 administrator@<host>
#
# Secrets live in deploy/.env (not committed) -- see .env.example.
#   docker compose up -d --build

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: deploy/airflow/Dockerfile
  image: birddog-airflow:local
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${JWT_SECRET}
    AIRFLOW__API_AUTH__JWT_ISSUER: birddog
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # public URL behind Caddy (links, redirects after login)
    AIRFLOW__API__BASE_URL: https://airflow.${PUBLIC_DOMAIN}
    # Birddog's own database, used by the DAGs
    AIRFLOW_CONN_BIRDDOG_PG: postgresql://birddog:${BIRDDOG_DB_PASSWORD}@postgres:5432/birddog
    # the birddog library itself reads this (birddog/pg.py)
    BIRDDOG_DATABASE_URL: postgresql://birddog:${BIRDDOG_DB_PASSWORD}@postgres:5432/birddog
    PYTHONPATH: /opt/birddog
    RCLONE_CONFIG: /opt/airflow/rclone/rclone.conf
  volumes:
    - ../dags:/opt/airflow/dags
    - ../birddog:/opt/birddog/birddog
    - ../resources:/opt/birddog/resources
    - airflow-logs:/opt/airflow/logs
    - birddog-cache:/opt/birddog/.cache
    - ./rclone:/opt/airflow/rclone
  # birddog loads resources/*.json relative to the working directory
  working_dir: /opt/birddog
  user: "50000:0"
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    # memory limits on every service (no swap on the host) keep one runaway
    # container from getting Postgres OOM-killed
    mem_limit: 1536m
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      BIRDDOG_DB_PASSWORD: ${BIRDDOG_DB_PASSWORD}
      # read by db/init/02-ui.sh (curator UI roles)
      BIRDDOG_UI_DB_PASSWORD: ${BIRDDOG_UI_DB_PASSWORD}
      MATHESAR_DB_PASSWORD: ${MATHESAR_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      retries: 5
      start_period: 5s

  # Applies deploy/db/migrations/*.sql in order on every `up`. Each file is
  # idempotent, so re-running is safe.
  migrate:
    image: postgres:16
    mem_limit: 256m
    environment:
      PGHOST: postgres
      PGUSER: birddog
      PGDATABASE: birddog
      PGPASSWORD: ${BIRDDOG_DB_PASSWORD}
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c", "for f in /migrations/*.sql; do echo \"applying $$f\"; psql -v ON_ERROR_STOP=1 -q -f \"$$f\" || exit 1; done"]
    depends_on:
      postgres:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    mem_limit: 512m
    entrypoint: /bin/bash
    # wiki_api pool: caps concurrent MediaWiki callers across all DAGs
    command: ["-c", "/entrypoint airflow version && /entrypoint airflow pools set wiki_api 3 'MediaWiki API callers'"]
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    user: "0:0"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    restart: unless-stopped
    mem_limit: 768m
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    # task processes (LocalExecutor) run inside the scheduler container
    mem_limit: 1536m
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  # Curator UI: forms and grids over core.* (replaces NocoDB for curators).
  # Metadata in its own `mathesar` database; it reaches birddog as the
  # restricted birddog_ui role. Configured by ui/setup.sh -- see ui/README.md.
  #   ssh -L 8000:127.0.0.1:8000 administrator@<host>   then http://localhost:8000
  mathesar:
    image: mathesar/mathesar:0.12.0
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${MATHESAR_SECRET_KEY}
      ALLOWED_HOSTS: "localhost,127.0.0.1,[::1],data.${PUBLIC_DOMAIN}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mathesar
      POSTGRES_USER: mathesar
      POSTGRES_PASSWORD: ${MATHESAR_DB_PASSWORD}
      WEB_CONCURRENCY: "3"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - mathesar-media:/code/.media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz/ready/"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # Shared notebooks (hub.<PUBLIC_DOMAIN>): JupyterHub with its own sign-up +
  # admin approval; each user gets a container from jupyter-singleuser (2 GB,
  # 1 CPU) on this network, connecting to Postgres as read-only birddog_reader.
  # The hub drives the host Docker daemon (socket mount) -- see
  # jupyterhub/README.md for what that implies.
  jupyterhub:
    build:
      context: ..
      dockerfile: deploy/jupyterhub/Dockerfile
    image: birddog-jupyterhub:local
    restart: unless-stopped
    mem_limit: 256m
    environment:
      JUPYTERHUB_ADMIN_USER: ${JUPYTERHUB_ADMIN_USER:-admin}
      JUPYTERHUB_ADMIN_PASSWORD: ${JUPYTERHUB_ADMIN_PASSWORD}
      JUPYTER_DB_PASSWORD: ${JUPYTER_DB_PASSWORD}
      JUPYTER_SINGLEUSER_IMAGE: birddog-jupyter-singleuser:local
      # compose's default network for project "deploy"
      DOCKER_NETWORK_NAME: deploy_default
      # host path of the repo; the host Docker daemon bind-mounts birddog/ and
      # resources/ from here into users' containers
      BIRDDOG_HOST_REPO: ${BIRDDOG_HOST_REPO:-/home/administrator/birddog-revised}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jupyterhub-data:/data
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Build-only: the per-user notebook image the hub spawns. Never started by
  # compose (profile); sh/deploy builds it before `up`.
  jupyter-singleuser:
    build:
      context: ..
      dockerfile: deploy/jupyterhub/singleuser.Dockerfile
    image: birddog-jupyter-singleuser:local
    profiles: ["build-only"]

  # Low-code app builders, compared side by side (deploy/apps/README.md).
  # Each keeps its metadata in its own database on our Postgres (db/init/04-apps.sh)
  # and reaches Birddog data as birddog_ui, added in-app as a datasource.
  # ToolJet CE at apps.<PUBLIC_DOMAIN>. Redis is bundled in the image; PostgREST
  # is not run, so the built-in "ToolJet Database" tables feature is unavailable.
  tooljet:
    image: tooljet/tooljet-ce:v3.20.256-lts
    restart: unless-stopped
    mem_limit: 1024m
    command: ["npm", "run", "start:prod"]
    environment:
      TOOLJET_HOST: https://apps.${PUBLIC_DOMAIN}
      SERVE_CLIENT: "true"
      PORT: "3000"
      LOCKBOX_MASTER_KEY: ${TOOLJET_LOCKBOX_MASTER_KEY}
      SECRET_KEY_BASE: ${TOOLJET_SECRET_KEY_BASE}
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: tooljet
      PG_USER: tooljet
      PG_PASS: ${TOOLJET_DB_PASSWORD}
      # databases are pre-created by db/init/04-apps.sh; the role has no CREATEDB
      PG_DB_OWNER: "false"
      TOOLJET_DB: tooljet_db
      TOOLJET_DB_HOST: postgres
      TOOLJET_DB_PORT: "5432"
      TOOLJET_DB_USER: tooljet
      TOOLJET_DB_PASS: ${TOOLJET_DB_PASSWORD}
      TOOLJET_DB_OWNER: "false"
      # no per-workspace Postgres roles (would need CREATEROLE)
      TJDB_SQL_MODE_DISABLE: "true"
      SAMPLE_DB: tooljet_sample
      # admin exists; further users join by invitation only
      DISABLE_SIGNUPS: "true"
      DISABLE_TOOLJET_TELEMETRY: "true"
      CHECK_FOR_UPDATES: "false"
      NODE_OPTIONS: --max-old-space-size=768
    ports:
      - "127.0.0.1:8082:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s
    depends_on:
      postgres:
        condition: service_healthy

  # Saltcorn at saltcorn.<PUBLIC_DOMAIN>. `serve -a` creates its schema in the
  # empty saltcorn database on first start (non-destructive afterwards).
  saltcorn:
    image: saltcorn/saltcorn:1.6.4
    restart: unless-stopped
    mem_limit: 512m
    command: ["serve", "-a"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: saltcorn
      PGUSER: saltcorn
      PGPASSWORD: ${SALTCORN_DB_PASSWORD}
      SALTCORN_SESSION_SECRET: ${SALTCORN_SESSION_SECRET}
      # one web worker (default is one per CPU) to stay within mem_limit
      SALTCORN_NWORKERS: "1"
      # postgres-tables plugin reads the remote password from SC_EXTPG_PASS_<db>,
      # so the birddog_ui password need not be stored in Saltcorn
      SC_EXTPG_PASS_birddog: ${BIRDDOG_UI_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/auth/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    ports:
      - "127.0.0.1:8083:3000"
    volumes:
      # uploaded files and installed plugins
      - saltcorn-data:/root/.local/share/saltcorn-nodejs
    depends_on:
      postgres:
        condition: service_healthy

  # The Birddog web app (birddog.<PUBLIC_DOMAIN>): Flask under gunicorn. Reads
  # and writes Postgres as the birddog_web role (db/init/05-web.sh,
  # migrations/012_web_role.sql); background work (page refresh, translation,
  # watchlist checks) runs as Airflow DAG runs it triggers through the REST API
  # as the Airflow user AIRFLOW_API_USER. See web/README.md.
  birddog-web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    image: birddog-web:local
    restart: unless-stopped
    mem_limit: 768m
    environment:
      BIRDDOG_DATABASE_URL: postgresql://birddog_web:${BIRDDOG_WEB_DB_PASSWORD}@postgres:5432/birddog
      BIRDDOG_SECRET_KEY: ${BIRDDOG_SECRET_KEY}
      AIRFLOW_API_URL: http://airflow-apiserver:8080
      AIRFLOW_API_USER: ${AIRFLOW_API_USER:-birddog-web}
      AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD}
      # password-reset mail (optional)
      BIRDDOG_SMTP_SERVER: ${BIRDDOG_SMTP_SERVER:-}
      BIRDDOG_SMTP_PORT: ${BIRDDOG_SMTP_PORT:-}
      BIRDDOG_SMTP_USERNAME: ${BIRDDOG_SMTP_USERNAME:-}
      BIRDDOG_SMTP_PASSWORD: ${BIRDDOG_SMTP_PASSWORD:-}
    ports:
      - "127.0.0.1:8084:8000"
    volumes:
      - birddog-web-cache:/opt/birddog/.cache
    depends_on:
      postgres:
        condition: service_healthy

  # Public HTTPS for Airflow, Mathesar and JupyterHub (the only ports open to the world)
  caddy:
    image: caddy:2.11.8
    restart: unless-stopped
    mem_limit: 128m
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - airflow-apiserver
      - mathesar

volumes:
  caddy-data:
  caddy-config:
  pg-data:
  airflow-logs:
  birddog-cache:
  mathesar-media:
  jupyterhub-data:
  saltcorn-data:
  birddog-web-cache:
