# caddy_stale: true when the running Caddy has another copy of
# deploy/caddy/<caddyfile> than this checkout (caddyfile_stale in
# sh/lib/deploy-common.sh). A single-file bind mount keeps the inode it was
# started with, and rsync replaces files by rename, so after a change Caddy
# needs a restart (`caddy reload` would re-read the old copy). Comparing with
# the checkout (not the server's file) gives the same answer after the sync
# and a real one in check mode. Not running: false (nothing to restart).
# Unreadable (exec failed): true, as in the sh check (Caddy may be restarted).

- name: Caddy | sha256 of the running Caddyfile
  ansible.builtin.shell: |
    set -o pipefail
    cid=$(docker compose ps -q caddy)
    [ -n "$cid" ] || { echo NOTRUNNING; exit 0; }
    docker compose exec -T caddy cat /etc/caddy/Caddyfile | sha256sum | cut -d' ' -f1
  args:
    chdir: "{{ deploy_dir }}"
    executable: /bin/bash
  register: caddy_running_sum
  changed_when: false
  failed_when: false
  check_mode: false

- name: Caddy | sha256 of the checkout's Caddyfile
  ansible.builtin.stat:
    path: "{{ repo_root }}/deploy/caddy/{{ caddyfile }}"
    get_checksum: true
    checksum_algorithm: sha256
  delegate_to: localhost
  register: caddy_local

- name: Caddy | compare
  ansible.builtin.set_fact:
    caddy_stale: >-
      {{ (caddy_running_sum.stdout | trim) != 'NOTRUNNING'
         and (caddy_running_sum.rc != 0 or (caddy_running_sum.stdout | trim) != caddy_local.stat.checksum) }}
