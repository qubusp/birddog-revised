# Read when ansible-playbook runs from deploy/ansible (README.md).
[defaults]
inventory = inventory.yml
interpreter_python = auto_silent
retry_files_enabled = False
callback_result_format = yaml
# a deploy talks to one box at a time; keep output in task order
forks = 1

[ssh_connection]
pipelining = True
# StrictHostKeyChecking=yes: the box must already be in known_hosts (CI writes
# DEPLOY_KNOWN_HOSTS there); an unknown or changed host key stops the deploy.
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ConnectTimeout=15 -o ServerAliveInterval=30 -o StrictHostKeyChecking=yes
