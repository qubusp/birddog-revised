# Apps box (108.181.191.55): the UI side of a two-box deployment.
# Used as an override of docker-compose.yml via COMPOSE_FILE in this box's .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.appsbox.yml
# Postgres and Airflow run on the data box and are reached over WireGuard
# (10.77.0.1, see two-box.md); the compose names `postgres` and
# `airflow-apiserver` resolve to it, so app configs need no changes.

x-databox-hosts: &databox-hosts
  extra_hosts:
    - "postgres:10.77.0.1"
    - "airflow-apiserver:10.77.0.1"

services:
  # data-box services: never started here
  postgres: {profiles: [databox]}
  migrate: {profiles: [databox]}
  airflow-init: {profiles: [databox]}
  airflow-apiserver: {profiles: [databox]}
  airflow-scheduler: {profiles: [databox]}
  airflow-dag-processor: {profiles: [databox]}

  # The apps' own metadata databases (mathesar, tooljet, tooljet_db,
  # tooljet_sample, saltcorn) live here, next to the apps; only Birddog data
  # crosses the link. Not published on any port.
  apps-postgres:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 768m
    environment:
      POSTGRES_PASSWORD: ${APPS_POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    volumes:
      - apps-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  mathesar:
    <<: *databox-hosts
    depends_on: !override
      apps-postgres: {condition: service_healthy}
    environment:
      POSTGRES_HOST: apps-postgres
  jupyterhub:
    <<: *databox-hosts
    depends_on: !reset []
    environment:
      # passed on to the per-user notebook containers DockerSpawner starts
      JUPYTER_EXTRA_HOSTS: "postgres:10.77.0.1"
  tooljet:
    <<: *databox-hosts
    depends_on: !override
      apps-postgres: {condition: service_healthy}
    environment:
      PG_HOST: apps-postgres
      TOOLJET_DB_HOST: apps-postgres
  saltcorn:
    <<: *databox-hosts
    depends_on: !override
      apps-postgres: {condition: service_healthy}
    environment:
      PGHOST: apps-postgres
  # Marmot data catalog (catalog.<PUBLIC_DOMAIN>; deploy/marmot/README.md).
  # Its own database lives in apps-postgres; it reads Birddog data on the data
  # box as the read-only birddog_reader (set up in its UI as a pipeline).
  marmot-db-init:
    image: postgres:16
    restart: "no"
    mem_limit: 64m
    depends_on:
      apps-postgres: {condition: service_healthy}
    environment:
      PGHOST: apps-postgres
      PGUSER: postgres
      PGPASSWORD: ${APPS_POSTGRES_PASSWORD}
      MARMOT_DB_PASSWORD: ${MARMOT_DB_PASSWORD}
    command:
      - bash
      - -ec
      - |
        psql -v ON_ERROR_STOP=1 -q -v pw="$$MARMOT_DB_PASSWORD" <<'SQL'
        SELECT 'CREATE ROLE marmot LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE'
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'marmot') \gexec
        ALTER ROLE marmot PASSWORD :'pw';
        SELECT 'CREATE DATABASE marmot OWNER marmot'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'marmot') \gexec
        REVOKE CONNECT ON DATABASE marmot FROM PUBLIC;
        SQL
  marmot:
    <<: *databox-hosts
    image: ghcr.io/marmotdata/marmot:0.14.0
    command: ["run"]
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      marmot-db-init: {condition: service_completed_successfully}
    environment:
      MARMOT_DATABASE_HOST: apps-postgres
      MARMOT_DATABASE_PORT: "5432"
      MARMOT_DATABASE_NAME: marmot
      MARMOT_DATABASE_USER: marmot
      MARMOT_DATABASE_PASSWORD: ${MARMOT_DB_PASSWORD}
      MARMOT_SERVER_ENCRYPTION_KEY: ${MARMOT_ENCRYPTION_KEY}
      MARMOT_SERVER_ROOT_URL: https://catalog.${PUBLIC_DOMAIN}
      # Lets claude.ai's MCP connector register itself (OAuth DCR); without it
      # Marmot only accepts loopback redirect URIs. Comma-separated hosts.
      MARMOT_AUTH_DCR_ALLOWED_REDIRECT_HOSTS: claude.ai
    ports:
      - "127.0.0.1:8085:8080"
  # Grafana (grafana.<PUBLIC_DOMAIN>): maps and dashboards over the birddog
  # database, read-only as birddog_reader. Datasource and dashboards come from
  # the repo (grafana/); accounts are copied from Birddog (birddog/user_sync.py).
  grafana:
    <<: *databox-hosts
    image: grafana/grafana-oss:13.0.2
    restart: unless-stopped
    # 512m got OOM-killed (idles ~150 MB, spikes on start-up and dashboard loads)
    mem_limit: 2g
    environment:
      # don't update bundled plugins in the background: it fails on the
      # read-only bundle and adds to the start-up spike
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_SERVER_ROOT_URL: https://grafana.${PUBLIC_DOMAIN}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: light
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/archive-map.json
      JUPYTER_DB_PASSWORD: ${JUPYTER_DB_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:8086:3000"
  birddog-web:
    <<: *databox-hosts
    depends_on: !reset []
    environment:
      # Airflow's UI is on the data box's domain (Genizah's Airflow link)
      GENIZAH_AIRFLOW_DOMAIN: ${DATABOX_PUBLIC_DOMAIN:-204-12-218-112.sslip.io}
      # user sync (birddog/user_sync.py): Saltcorn's database and Marmot live here
      BIRDDOG_SYNC_SALTCORN_DB_URL: postgresql://saltcorn:${SALTCORN_DB_PASSWORD}@apps-postgres:5432/saltcorn
      BIRDDOG_SYNC_TOOLJET_DB_URL: postgresql://tooljet:${TOOLJET_DB_PASSWORD}@apps-postgres:5432/tooljet
      BIRDDOG_SYNC_MARMOT_URL: http://marmot:8080
      BIRDDOG_SYNC_MARMOT_API_KEY: ${BIRDDOG_SYNC_MARMOT_API_KEY:-}
      BIRDDOG_SYNC_GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
  caddy:
    depends_on: !reset []
    volumes: !override
      - ./caddy/Caddyfile.appsbox:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  apps-pg-data:
  grafana-data:
