# Data box (204.12.218.112): Postgres + Airflow side of a two-box deployment.
# Used as an override of docker-compose.yml via COMPOSE_FILE in this box's .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.databox.yml
# The UI apps run on the apps box (docker-compose.appsbox.yml), which reaches
# Postgres and the Airflow API over WireGuard (see two-box.md). Caddy here only
# serves the Airflow UI.

services:
  # apps-box services: not started here (`--profile apps` would bring them back)
  mathesar: {profiles: [apps]}
  jupyterhub: {profiles: [apps]}
  tooljet: {profiles: [apps]}
  saltcorn: {profiles: [apps]}
  birddog-web: {profiles: [apps]}

  # the UI apps moved off this box, so Postgres and the scheduler get the room
  postgres:
    mem_limit: 3g
    command:
      - postgres
      - -c
      - shared_buffers=768MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
  airflow-scheduler:
    mem_limit: 2560m

  caddy:
    depends_on: !reset [airflow-apiserver]
    volumes: !override
      - ./caddy/Caddyfile.databox:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
