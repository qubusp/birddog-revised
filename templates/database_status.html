<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Birddog Database Update Status</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
{% include '_assets.html' %}
</head>
<body class="bd-standalone">
  {% set page_kind = 'Admin' %}
  {% include '_page_bar.html' %}
  <main class="container bd-page">
    <div class="d-flex flex-wrap align-items-baseline gap-2 mb-3">
      <h1 class="mb-0 me-3">Database Update Status</h1>
      <!-- <button class="btn btn-outline-primary btn-sm" onclick="loadStatus()">Refresh</button> -->
      <span id="refresh-indicator" class="text-muted small"></span>
    </div>

    <div id="status-area">
      <p class="text-muted">Loading…</p>
    </div>
  </main>

  <script>
    let refreshTimer = null;

    async function loadStatus() {
      try {
        const resp = await fetch('/database_update');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        renderTasks(data.tasks || {});
        document.getElementById('refresh-indicator').textContent =
          'Last status refresh: ' + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById('status-area').innerHTML =
          `<div class="alert alert-danger">Failed to load status: ${err}</div>`;
      }
    }

    function renderTasks(tasks) {
      const area = document.getElementById('status-area');
      const names = Object.keys(tasks);
      if (names.length === 0) {
        area.innerHTML = '<div class="card"><div class="card-body text-muted">No database updates are running.</div></div>';
        return;
      }

      const rows = names.map(name => {
        const t = tasks[name];
        // location update tasks have no deep setting
        const deep = t.deep === undefined ? '' : (t.deep ? 'Yes' : 'No');
        return `
          <tr>
            <td>${t.kind ?? ''}</td>
            <td>${escapeHtml(t.description ?? '')}</td>
            <td>${escapeHtml(t.state ?? '')}</td>
            <td class="num">${t.total ?? ''}</td>
            <td class="num">${t.completed ?? ''}</td>
            <td>${deep}</td>
            <td>
              <button class="btn btn-sm btn-outline-danger" data-task="${escapeHtml(name)}" onclick="cancelTask(this.dataset.task)">
                Cancel
              </button>
            </td>
          </tr>`;
      }).join('');

      area.innerHTML = `
        <div class="table-scroll" tabindex="0" role="region" aria-label="Update tasks"><table class="table table-striped align-middle">
          <thead>
            <tr>
              <th>Kind</th>
              <th>Description</th>
              <th>State</th>
              <th class="num">Steps</th>
              <th class="num">Completed</th>
              <th>Deep</th>
              <th><span class="visually-hidden">Actions</span></th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table></div>`;
    }

    async function cancelTask(taskName) {
      if (!confirm(`Cancel database update task ${taskName}?`)) return;
      try {
        const resp = await fetch(
          `/database_cancel_task?task=${encodeURIComponent(taskName)}`,
          { method: 'POST' }
        );
        if (!resp.ok) {
          const body = await resp.json().catch(() => ({}));
          alert(`Cancel failed: ${body.error || resp.status}`);
        }
        else {
          alert(`Update task ${taskName} cancel sent. It may take a few minutes to fully cancel the process.`);
        }
      } catch (err) {
        alert(`Cancel request failed: ${err}`);
      }
      await loadStatus();
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function scheduleRefresh() {
      refreshTimer = setTimeout(async () => {
        await loadStatus();
        scheduleRefresh();
      }, 5000);
    }

    window.onload = async () => {
      await loadStatus();
      scheduleRefresh();
    };
  </script>
</body>
</html>
