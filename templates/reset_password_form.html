<!-- templates/reset_password_form.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password - Birddog</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
{% include '_assets.html' %}
</head>
<body class="bd-standalone">
{% include '_page_bar.html' %}

<main class="container">
  <section class="card auth-card" aria-labelledby="reset-heading">
    <div class="card-body">
      <h1 id="reset-heading" class="h3 mb-2">Reset Your Password</h1>
      <p class="text-muted">Choose a new password for your Birddog profile.</p>
      <form method="POST">
        <div class="mb-3">
          <label for="newPassword" class="form-label">New Password</label>
          <input type="password" class="form-control" id="newPassword" name="password" autocomplete="new-password" required{% if error %} aria-invalid="true" aria-describedby="newPasswordError"{% endif %}>
          {% if error %}<div id="newPasswordError" class="text-danger small mt-1">{{ error }}</div>{% endif %}
        </div>
        <button type="submit" class="btn btn-primary w-100">Set New Password</button>
      </form>
    </div>
  </section>
</main>

</body>
</html>
