# Operations: smoke test, nightly encrypted backup to Google Drive, weekly
# restore check. rclone reads deploy/rclone/rclone.conf, which must define the
# gdrive-crypt remote (see deploy/rclone/README.md). pg_dump/pg_restore come
# from the Postgres 16 client so dumps match the server's major version.
default:
  catchup: false
  max_active_runs: 1
  default_args:
    start_date: 2026-11-01
    retries: 1
    retry_delay_sec: 600
  tags: [ops]

stack_check:
  description: Smoke test - birddog library imports and the database has its schemas
  schedule: null
  tasks:
    - task_id: birddog_library
      decorator: airflow.sdk.task
      python_callable: birddog.dag_tasks.check_birddog_library
    - task_id: birddog_database
      decorator: airflow.sdk.task
      python_callable: birddog.dag_tasks.check_birddog_database

backup_postgres:
  description: Encrypted pg_dump to Google Drive (7 daily, 4 weekly, 12 monthly)
  schedule: "0 2 * * *"
  tasks:
    - task_id: dump_and_upload
      operator: airflow.providers.standard.operators.bash.BashOperator
      bash_command: |
        set -euo pipefail
        export PATH=/usr/lib/postgresql/16/bin:$PATH
        remote=gdrive-crypt:birddog-backups
        name=birddog-$(date -u +%Y%m%dT%H%MZ).dump
        file=/tmp/$name
        pg_dump --format=custom --no-owner --dbname="$BIRDDOG_DATABASE_URL" --file="$file"
        rclone copyto "$file" $remote/daily/$name
        # Sundays also go to weekly/, the 1st of the month to monthly/
        if [ "$(date -u +%u)" = 7 ]; then rclone copyto "$file" $remote/weekly/$name; fi
        if [ "$(date -u +%d)" = 01 ]; then rclone copyto "$file" $remote/monthly/$name; fi
        rm -f "$file"
        rclone delete --min-age 8d $remote/daily || true
        rclone delete --min-age 35d $remote/weekly || true
        rclone delete --min-age 400d $remote/monthly || true
        echo "uploaded $name"

verify_restore:
  description: Restores the latest backup into a scratch database and compares row counts
  schedule: "0 4 * * 0"
  tasks:
    - task_id: restore_latest
      operator: airflow.providers.standard.operators.bash.BashOperator
      # restores as the postgres superuser (the birddog role can't create databases)
      bash_command: |
        set -euo pipefail
        export PATH=/usr/lib/postgresql/16/bin:$PATH
        remote=gdrive-crypt:birddog-backups
        latest=$(rclone lsf --files-only $remote/daily | sort | tail -1)
        [ -n "$latest" ] || { echo "no backups found"; exit 1; }
        rclone copyto $remote/daily/$latest /tmp/restore.dump
        export PGHOST=postgres PGUSER=postgres PGPASSWORD="$POSTGRES_PASSWORD"
        dropdb --if-exists birddog_restore_check
        createdb birddog_restore_check
        pg_restore --no-owner --exit-on-error --dbname=birddog_restore_check /tmp/restore.dump
        rm -f /tmp/restore.dump
        echo "$latest"
    - task_id: compare_counts
      decorator: airflow.sdk.task
      python_callable: birddog.dag_tasks.compare_restored_counts
      dependencies: [restore_latest]
    - task_id: drop_scratch
      operator: airflow.providers.standard.operators.bash.BashOperator
      trigger_rule: all_done
      bash_command: PGHOST=postgres PGUSER=postgres PGPASSWORD="$POSTGRES_PASSWORD" /usr/lib/postgresql/16/bin/dropdb --if-exists birddog_restore_check
      dependencies: [compare_counts]
