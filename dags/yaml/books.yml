# Book reading: Claude reads the page images of archive books (PDFs on
# Commons) and lists the places they name. Probe (Haiku) -> cost gate -> read
# (Sonnet, Opus for hard pages) -> assemble (Haiku + fuzzy match to
# core.location). Queue and results: core.book_read / core.book_page
# (migration 017). Task code: birddog/dag_tasks_books.py -> birddog/books.py.
#
# Manual only while piloting. Each run: queues `enqueue` new books (0 = none),
# probes every pending book, reads approved books until `budget_usd` is spent,
# assembles finished books. Books over `auto_limit_tokens` wait in
# views.books__needs_approval: set status to approved/rejected in
# core.book_read (Mathesar), then trigger the DAG again.
#
# Key: the Airflow connection `anthropic` (password = API key); no restart
# needed to set or change it. Without it the Claude steps skip.
default:
  catchup: false
  max_active_runs: 1
  default_args:
    start_date: 2026-11-01
    retries: 1
    retry_delay_sec: 300
  tags: [enrich, books, claude]

read_books:
  description: Claude reads archive books page by page and lists the places they name
  schedule: null
  params:
    enqueue: 0            # new books to queue this run
    doc_type: Vitals      # core.document.doc_type to queue from
    max_pages: ""         # queue only books up to this many pages (empty = any)
    auto_limit_tokens: 500000
    budget_usd: 10
  tasks:
    - task_id: enqueue
      decorator: airflow.sdk.task
      python_callable: birddog.dag_tasks_books.enqueue_books
      enqueue: "{{ params.enqueue }}"
      doc_type: "{{ params.doc_type }}"
      max_pages: "{{ params.max_pages }}"
      retries: 0
    - task_id: probe
      decorator: airflow.sdk.task
      python_callable: birddog.dag_tasks_books.probe_books
      auto_limit_tokens: "{{ params.auto_limit_tokens }}"
      pool: llm_api
      dependencies: [enqueue]
      execution_timeout:
        __type__: datetime.timedelta
        hours: 1
    - task_id: read
      decorator: airflow.sdk.task
      python_callable: birddog.dag_tasks_books.read_books
      budget_usd: "{{ params.budget_usd }}"
      pool: llm_api
      dependencies: [probe]
      execution_timeout:
        __type__: datetime.timedelta
        hours: 6
    - task_id: assemble
      decorator: airflow.sdk.task
      python_callable: birddog.dag_tasks_books.assemble_books
      pool: llm_api
      dependencies: [read]
      execution_timeout:
        __type__: datetime.timedelta
        hours: 1
